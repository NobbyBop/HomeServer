services:
  portfolio:
    build: ./portfolio
    container_name: portfolio
    ports:
      - 8000:8000
    restart: 'unless-stopped'

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096
    # IMPORTANT - If migrating computers, may need to change volume info.
    volumes:
      - ~/.jellyfin/config:/config
      - ~/.jellyfin/cache:/cache
      - type: bind
        source: /media/WD_BLACK
        target: /media
    restart: 'unless-stopped'
  nginx:
    image: nginx:1-alpine
    container_name: nginx
    ports:
      - "443:443" 
    volumes:

        # IMPORTANT - If migrating computers, may need to change these!!!
      - /home/raspi/HomeServer/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/mysslcerts/origincert:/etc/ssl/ssl_certificate:ro
      - /etc/mysslcerts/originkey:/etc//ssl/ssl_certificate_key:ro
      - /var/log/nginx:/var/log/nginx
    restart: 'unless-stopped'
    depends_on:
    - portfolio
