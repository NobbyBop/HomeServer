services:
  portfolio:
    build: ./portfolio
    container_name: portfolio
    ports:
      - 8000:8000
    restart: 'unless-stopped'  
  pnf:
    build: ./pnf/app
    container_name: pnf
    ports:
      - 5555:5555
    volumes:
      - /etc/pnfsotd/:/etc/pnfsotd/
    restart: 'unless-stopped'
  nginx:
    image: nginx:1-alpine
    container_name: nginx
    ports:
      - "443:443" 
    volumes:

        # IMPORTANT - If migrating computers, may need to change these!!!
      - /home/raspi/HomeServer/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/mysslcerts/origincert:/etc/ssl/ssl_certificate:ro
      - /etc/mysslcerts/originkey:/etc//ssl/ssl_certificate_key:ro
      - /etc/mysslcerts/pnfcert:/etc/ssl/pnfcert:ro
      - /etc/mysslcerts/pnfcert_key:/etc//ssl/pnfcert_key:ro
      - /var/log/nginx:/var/log/nginx
    restart: 'unless-stopped'
    depends_on:
    - portfolio
    - pnf
