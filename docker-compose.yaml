# LOCAL_MEDIA_FOLDER=C:\\Users\\nicho\\Desktop\\media\\
# LOCAL_INGEST_FOLDER=C:\\Users\\nicho\\Desktop\\ingest\\
# LOCAL_DATABASE_FOLDER=C:\\Users\\nicho\\Desktop\\db\\

services:
    media_mongo:
        image: mongo
        ports:
            - 27017:27017
        volumes:
            - "C:\\Users\\nicho\\Desktop\\db\\:/data/db"
    
    media_library:
        build: ./media_library/
        ports:
            - 8000:8000
        environment:
            MONGO_CONNECT_URL: "mongodb://media_mongo:27017/"
            MEDIA_FOLDER: "/media/"
            INGEST_FOLDER: "/ingest/"
        volumes:
            - "C:\\Users\\nicho\\Desktop\\media\\:/media/"
            - "C:\\Users\\nicho\\Desktop\\ingest\\:/ingest/"
        depends_on:
            - media_mongo
        develop:
            watch:
                - action: sync
                  path: ./media_library/src/
                  target: /src/
        